name: Compression package qualification

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOKA_VERSION: v1.0.0-rc.9

jobs:
  qualify:
    name: Qualify (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            asset: toka-v1.0.0-rc.9-linux-x64.tar.gz
            sha256: 432b27087a89d2519e1a50726ed31f6556e4ed130e3d91c2315713c1cd099097
          - name: macos-arm64
            runner: macos-15
            asset: toka-v1.0.0-rc.9-macos-arm64.tar.gz
            sha256: d13622ffad63db32479db78095bf66b96b4976c0d15aa6c30257e676d66f64ac

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y binutils curl lsb-release pkg-config software-properties-common wget \
            zlib1g-dev libzstd-dev libssl-dev
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo -E ./llvm.sh 20
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
          echo "CC=clang-20" >> "$GITHUB_ENV"

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm@20 lld@20 pkgconf zlib zstd openssl@3
          llvm_prefix="$(brew --prefix llvm@20)"
          zlib_prefix="$(brew --prefix zlib)"
          zstd_prefix="$(brew --prefix zstd)"
          openssl_prefix="$(brew --prefix openssl@3)"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          echo "CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$zlib_prefix/lib/pkgconfig:$zstd_prefix/lib/pkgconfig:$openssl_prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install locked Toka SDK
        env:
          TOKA_ASSET: ${{ matrix.asset }}
          TOKA_ASSET_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$TOKA_ASSET"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/tokalang/toka/releases/download/$TOKA_VERSION/$TOKA_ASSET"
          python3 -c 'import hashlib, pathlib, sys; actual = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest(); expected = sys.argv[2]; assert actual == expected, f"SHA-256 mismatch: {actual} != {expected}"' \
            "$archive" "$TOKA_ASSET_SHA256"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/${TOKA_ASSET%.tar.gz}"
          test -x "$sdk/bin/toka"
          test -x "$sdk/bin/tokac"
          test -f "$sdk/lib/sys/toka_rt.o"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "TOKA=$sdk/bin/toka" >> "$GITHUB_ENV"
          echo "TOKAC=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"

      - name: Verify locked toolchain
        run: |
          set -euo pipefail
          "$TOKA" --version | grep -F "1.0.0-rc.9"
          "$TOKAC" --version | grep -F "1.0.0-rc.9"
          pkg-config --exists zlib
          pkg-config --atleast-version=1.4.0 libzstd

      - name: Run standalone qualification
        run: python3 tests/qualify_package.py
